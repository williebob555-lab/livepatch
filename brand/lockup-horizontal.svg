<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="LivePatch">
  <title>LivePatch lockup — horizontal, for dark backgrounds</title>
  <!-- Primary lockup. Clear space either side is the mark's corner radius
       (56 units at mark scale = 35 px here); it's already in the viewBox, so
       don't crop into it, and don't re-space the mark and wordmark yourself. -->
  <g transform="translate(30 30) scale(0.625)">
    <rect width="256" height="256" rx="56" fill="#14161a"/>
    <path d="M62 70 V188 H142 V94" fill="none" stroke="#c9a2ff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="168" cy="94" r="30" fill="#14161a" stroke="#5fb2ff" stroke-width="17"/>
  </g>
  <text x="228" y="148" font-family="Segoe UI Variable Display, Segoe UI, Inter, -apple-system, system-ui, Helvetica Neue, Arial, sans-serif" font-size="132" font-weight="700" letter-spacing="-3" fill="#e8ecf2">L</text>
  <rect x="318" y="60" width="10" height="90" rx="5" fill="#333c49"/>
  <rect x="301" y="78" width="44" height="25" rx="8" fill="#c9a2ff"/>
  <rect x="308" y="89" width="30" height="3" rx="1.5" fill="#14161a" opacity="0.55"/>
  <text x="352" y="148" font-family="Segoe UI Variable Display, Segoe UI, Inter, -apple-system, system-ui, Helvetica Neue, Arial, sans-serif" font-size="132" font-weight="700" letter-spacing="-3"><tspan fill="#e8ecf2">ve</tspan><tspan fill="#5fb2ff">Patch</tspan></text>
</svg>
