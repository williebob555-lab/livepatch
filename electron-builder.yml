appId: com.livepatch.app
productName: LivePatch
directories:
  output: release
  buildResources: build

# Use the Electron already unpacked in node_modules instead of re-extracting the
# cached zip. This is a BUILD RELIABILITY fix, not an optimisation.
#
# The default path extracts the cached electron-v<ver>-win32-x64.zip into
# `release/win-unpacked.tmp` and immediately renames it to `release/win-unpacked`.
# On Windows that rename lands inside Defender's scan window for a freshly
# unpacked 225 MB electron.exe carrying mark-of-the-web, and fails with
#   EPERM: operation not permitted, rename '...win-unpacked.tmp' -> '...win-unpacked'
# The failure is deterministic (it killed the 0.1.6 AND 0.1.7 releases, leaving
# empty drafts on GitHub), but the lock is transient — probing the same
# directory minutes later renames fine, which is why retrying the build never
# helped: each retry re-enters the same window. Raw error is
# ERROR_SHARING_VIOLATION (32), i.e. another process holds a read handle on the
# directory, not a permissions problem.
#
# Pointing electronDist at an already-unpacked distribution takes a different
# branch in app-builder-lib (`emptyDir` + `copyDir`, see ElectronFramework.js
# "using custom unpacked Electron distribution") that never creates a .tmp and
# never renames, so there is no window to lose. The `electron` devDependency is
# the same version electron-builder would download, so this cannot drift — if it
# ever does, electron-builder fails loudly on the version mismatch rather than
# shipping the wrong runtime. See docs/11-packaging.md.
electronDist: node_modules/electron/dist

# MUST stay false. The audio engine runs as its own process on a real node.exe
# (audify's prebuilt binary access-violates inside electron.exe — verified
# 0xC0000005), and plain Node cannot read inside an asar archive, so packing
# would break `require('audify')` and the engine would never start.
asar: false

# Do NOT rebuild native modules against Electron's ABI. Both native deps
# (audify, @julusian/midi) are required by the ENGINE, which runs on the
# bundled node.exe — they must keep their Node-ABI prebuilds. Rebuilding also
# needs Python/MSVC and fails outright on a path containing a space.
npmRebuild: false

files:
  - dist/**            # renderer bundle (vite)
  - dist-engine/**     # audio engine (tsc → CommonJS)
  - electron/**        # main + preload
  - package.json
  - '!**/*.map'
  # node_modules is added automatically from "dependencies"; audify and
  # @julusian/midi must ship unpacked so their .node binaries are loadable.

# The Node runtime that hosts the engine, so the app works on machines with no
# Node installed. Populated by `npm run bundle:node`.
extraResources:
  - from: build/node.exe
    to: node.exe
  # VST3 host addon — REQUIRED in every build. The packaging scripts
  # (`package`, `package:dir`, `release`) run `npm run build:vsthost` first, so
  # this file is freshly compiled before electron-builder runs. It is a direct
  # file `from` (not a directory + filter) on purpose: if the addon is missing,
  # electron-builder ERRORS here instead of silently shipping a build with VST3
  # hosting disabled — the exact silent-loss trap this used to be. If you want
  # to ship a build without VST hosting, remove `build:vsthost` from the script
  # chain in package.json deliberately, don't rely on a missing file. Built by
  # `node scripts/build-vsthost.mjs`; findVstAddon() resolves it at
  # resources/vsthost.node.
  - from: native/vsthost/build/Release/vsthost.node
    to: vsthost.node

win:
  target: [nsis]
  # Generated by `npm run brand` from brand/mark-square*.svg — three optical
  # variants across 16–256 px. Regenerate it there, never hand-edit.
  icon: build/icon.ico

# Per-user install: %LOCALAPPDATA%\Programs\LivePatch, no UAC prompt, no
# Program Files. `allowElevation: false` keeps it that way — an elevated
# install would put the app somewhere the updater cannot write, which is
# exactly how silent auto-update failures happen.
#
# NSIS is also the ONLY Windows target electron-builder writes `latest.yml`
# for (portable and zip pass isWriteUpdateInfo=false), and the only one
# electron-updater knows how to install. Changing this target breaks
# in-app updates. See docs/11-packaging.md.
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: LivePatch
  # Scenes/cassettes live in %APPDATA%, not the install dir — never take them
  # with the uninstaller.
  deleteAppDataOnUninstall: false
  artifactName: LivePatch-${version}-setup.${ext}

# Where `--publish always` uploads and where the app looks for updates. Owner
# and repo are derived from package.json "repository" — one place to change.
# The repo (or at least its releases) must be public, otherwise asset
# downloads need a token baked into the shipped app.
publish:
  provider: github
  # Go live on upload instead of leaving a draft to publish by hand. The
  # tradeoff: a broken build reaches users the moment it finishes uploading,
  # with no chance to look at it first. Set back to `draft` to get the
  # safety net.
  releaseType: release
